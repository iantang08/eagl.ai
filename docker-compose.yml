services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eaglai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/eaglai
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-change-in-production
      LOCAL_S3_DIR: /app/local_s3
      USE_LOCAL_STORAGE: "true"
      DEV_SKIP_ANALYSIS: "false"
      ENABLE_DEV_SUBSCRIPTION_ENDPOINT: "true"
      AWS_S3_BUCKET: eaglai-uploads
      AWS_REGION: us-east-1
      CORS_ORIGINS: "*"
      MAX_UPLOAD_SIZE_MB: "100"
      MAX_VIDEO_DURATION_SECONDS: "30"
    volumes:
      - ./services/api:/app
      - ./local_s3:/app/local_s3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/eaglai
      REDIS_URL: redis://redis:6379/0
      LOCAL_S3_DIR: /app/local_s3
      USE_LOCAL_STORAGE: "true"
      DEV_SKIP_ANALYSIS: "false"
      AWS_S3_BUCKET: eaglai-uploads
      AWS_REGION: us-east-1
    volumes:
      - ./services/worker:/app
      - ./local_s3:/app/local_s3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=2

volumes:
  postgres_data:
